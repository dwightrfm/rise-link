<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03070b">
<title>Team RISE Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
@property --r{syntax:'<number>';inherits:true;initial-value:0}
@property --pp{syntax:'<percentage>';inherits:true;initial-value:0%}
:root{
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sans:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","New York",Georgia,serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --ink:#f4f8f9;--mut:rgba(228,240,243,.68);--dim:rgba(228,240,243,.42);
  --teal:#46d9d2;--gold:#ffc46b;--brand:#33707f;
  --acc:color-mix(in oklab,var(--teal),var(--gold) var(--pp));
  --acc2:color-mix(in oklab,#2a9fd6,#ff8a5b var(--pp));
  --line:rgba(255,255,255,.13);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03070b;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{--r:0;--pp:0%;transition:--r 3s cubic-bezier(.45,0,.2,1),--pp 3s cubic-bezier(.45,0,.2,1);perspective:1600px}
button{font:inherit;color:inherit;cursor:pointer}

/* sky and sunrise */
#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#02050a 0%,#04101a calc(60% - var(--r)*20%),color-mix(in oklab,#0b2433,#3a2230 calc(var(--r)*70%)) 100%)}
.sun{position:fixed;left:50%;top:calc(116vh - var(--r) * 40vh);width:90vmax;height:90vmax;border-radius:50%;z-index:0;pointer-events:none;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,color-mix(in oklab,#ffd59a,#fff3dc calc(var(--r)*60%)) 0%,color-mix(in oklab,#ff8a5b,#ffc46b calc(var(--r)*100%)) 6%,rgba(255,138,91,.30) 16%,rgba(42,159,214,.10) 32%,transparent 50%);
  opacity:calc(.6 + var(--r)*.4);filter:blur(10px)}
.horizon{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:0;pointer-events:none;
  background:radial-gradient(90% 100% at 50% 100%,color-mix(in oklab,rgba(70,217,210,.20),rgba(255,196,107,.30) calc(var(--r)*100%)) 0%,transparent 70%)}
canvas#motes{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}

/* scenes */
.scene{position:fixed;inset:0;z-index:5;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateZ(-500px);filter:blur(20px);
  transition:opacity .8s var(--ease),transform 1.3s var(--ease),filter .9s var(--ease),visibility 0s linear 1.3s}
.scene.active{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .9s var(--ease) .1s,transform 1.4s var(--ease),filter 1s var(--ease) .1s,visibility 0s}
.scene.leaving{opacity:0;visibility:visible;transform:translateZ(380px);filter:blur(24px);transition:opacity .7s var(--ease),transform 1.1s var(--ease),filter .8s var(--ease),visibility 0s linear 1.1s}
.wrap{margin:auto;width:100%;max-width:1180px;padding:clamp(72px,9vh,110px) 16px clamp(28px,6vh,72px);text-align:center}

/* entrances */
.a{opacity:0}
.active .a{animation:var(--k,rise) var(--t,1.2s) var(--ease) var(--d,0s) both}
@keyframes rise{from{opacity:0;transform:translateY(46px);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes bloom{0%{opacity:0;transform:scale(.4);filter:blur(30px) brightness(3)}60%{opacity:1;filter:blur(0) brightness(1.3)}100%{opacity:1;transform:none;filter:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes track{from{opacity:0;letter-spacing:.9em;filter:blur(10px)}to{opacity:1;filter:none}}
.split .w{display:inline-block;white-space:nowrap}
.split em{background:none;-webkit-text-fill-color:currentColor;color:var(--acc);text-shadow:0 0 30px color-mix(in oklab,var(--acc),transparent 55%)}
.split .ch{display:inline-block;opacity:0;transform-origin:50% 100%}
.active .split .ch{animation:chIn 1.1s var(--ease) both;animation-delay:calc(var(--d,0s) + var(--i)*30ms)}
@keyframes chIn{from{opacity:0;transform:translateY(.5em) rotateX(-85deg);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.reveal{opacity:0;transform:translateY(30px) scale(.94);filter:blur(10px);transition:all 1s var(--ease)}
.reveal.on{opacity:1;transform:none;filter:none}

/* type */
.eyebrow{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.3em;font-size:clamp(11px,1.3vw,15px);color:var(--acc);display:inline-flex;align-items:center;gap:14px}
.eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--acc));box-shadow:0 0 10px var(--acc)}
.eyebrow::after{transform:scaleX(-1)}
.mega{font-size:clamp(46px,10vw,132px);font-weight:700;letter-spacing:-.05em;line-height:.95;margin:0}
.h1{font-size:clamp(36px,6.4vw,84px);font-weight:700;letter-spacing:-.04em;line-height:1;margin:0}
.h2{font-size:clamp(28px,4.4vw,56px);font-weight:650;letter-spacing:-.03em;line-height:1.08;margin:0}
.lede{font-size:clamp(17px,2.1vw,25px);font-weight:400;color:var(--mut);line-height:1.4;margin:0}
em,.em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--acc);
  background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0 .06em}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.24em;font-size:12px;color:var(--dim)}

/* glass */
.glass{position:relative;border-radius:24px;background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 55%,rgba(255,255,255,.06));
  border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12)}

/* logo */
.logo{width:clamp(120px,22vw,220px);height:auto;filter:drop-shadow(0 0 40px color-mix(in oklab,var(--acc),transparent 50%))}
.logo-big{width:clamp(180px,34vw,340px)}
.halo{position:relative;display:inline-block}
.halo::before{content:"";position:absolute;inset:-26%;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--acc),transparent 55%) 0%,transparent 66%);filter:blur(26px);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 32px;font-weight:700;font-size:18px;letter-spacing:.01em;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03070b;box-shadow:0 12px 36px color-mix(in oklab,var(--acc),transparent 62%);transition:transform .25s var(--spring),box-shadow .25s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn svg{width:20px;height:20px}

/* splash */
#splash .tapline{margin-top:30px;display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:17px}
#splash .tapline .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03070b}
#splash .vol{margin-top:22px;font-size:14px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px}
#splash{cursor:pointer}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(70,217,210,0),0 0 40px color-mix(in oklab,var(--acc),transparent 60%)}}

/* intro lists */
.items{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:38px;text-align:left}
.item{display:flex;align-items:center;gap:18px;padding:20px 22px}
.item .n{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#03070b;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 24px color-mix(in oklab,var(--acc),transparent 50%)}
.item .t{font-size:clamp(17px,2vw,23px);font-weight:600;line-height:1.25}
.rule{width:120px;height:3px;border-radius:3px;margin:18px auto 0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 18px var(--acc)}
.caption{margin-top:18px;font-size:clamp(34px,6vw,72px);font-weight:700;letter-spacing:-.035em}

/* challenge */
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,70px);align-items:center;text-align:left}
.pillars{display:flex;gap:16px;margin:30px 0}
.pillar{flex:1;padding:26px 20px;text-align:center;border-color:color-mix(in oklab,var(--acc),transparent 50%)}
.pillar .ic{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03070b}
.pillar .ic svg{width:28px;height:28px}
.pillar h3{margin:0;font-size:clamp(20px,2.4vw,28px);font-weight:750;letter-spacing:-.02em}
.lead{display:flex;gap:14px;align-items:stretch;margin-bottom:30px}
.lead .bar{width:5px;border-radius:5px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.lead p{margin:0;font-size:clamp(18px,2.2vw,25px);color:var(--mut);line-height:1.4}
.lead strong{color:var(--ink)}
.orb{position:relative;aspect-ratio:1;width:100%;max-width:440px;margin:auto}
.orb svg{width:100%;height:100%;overflow:visible}

.foot{max-width:900px;margin:34px auto 0;font-size:12px;line-height:1.55;color:var(--dim)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* quick check: 4 taps, one per screen */
.qwrap{max-width:560px;text-align:left}
.qprog{display:flex;align-items:center;gap:12px;margin:0 0 24px}
.qbar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.qbar span{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 14px color-mix(in oklab,var(--acc),transparent 50%);transition:width .45s var(--ease)}
.qpill{flex:none;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.qin{animation:qIn .4s var(--ease) both}
@keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qintro{margin:0 0 18px;font-size:17px;line-height:1.45;color:var(--mut)}
.qtext{font-size:clamp(25px,6.4vw,40px);font-weight:650;letter-spacing:-.03em;line-height:1.14;margin:0 0 22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;width:100%;min-height:56px;padding:14px 20px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  font-size:18px;font-weight:600;line-height:1.3;text-align:left;transition:transform .2s var(--spring),background .2s,border-color .2s}
@media (hover:hover){.opt:hover{border-color:color-mix(in oklab,var(--acc),transparent 40%)}}
.opt.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03070b;border-color:transparent;transform:scale(1.02)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.tlink{background:none;border:0;padding:12px 4px;font-size:17px;font-weight:600;color:var(--mut);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(255,255,255,.3)}
.tlink:hover{color:var(--ink)}

/* result + calendar: one screen */
.rwrap{max-width:600px;text-align:left}
.rtop{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.rtop .qbar{order:2}
.rcard{padding:22px 20px}
.rcard h2{font-size:clamp(26px,6.6vw,40px);font-weight:650;letter-spacing:-.03em;line-height:1.12;margin:0 0 14px}
.rcard p{margin:0 0 12px;font-size:18px;line-height:1.5}
.rcard .rclose{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--mut)}
.cal{margin-top:34px;scroll-margin-top:76px}
.cal .h2{font-size:clamp(26px,6.6vw,40px);margin:10px 0 0}
.cal .guide{margin:12px 0 0;font-size:18px;line-height:1.5}
.cal .shared{margin:8px 0 0;font-size:17px;line-height:1.5;color:var(--mut)}
.where{margin-top:16px;padding:14px 18px;font-size:16px;color:var(--mut);line-height:1.5}
.where b{color:var(--ink)}
.embed{margin-top:16px;padding:6px;overflow:hidden}
.embed iframe{display:block;width:100%;height:clamp(600px,84vh,800px);border:0;border-radius:16px;background:#fff}
.calacts{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:18px}
.calacts .btn{width:100%;white-space:normal;padding:16px 22px;line-height:1.25}

/* confirmation */
.cfacts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px}
.cfacts .btn{width:min(340px,100%);text-decoration:none}

/* mute */
#mute{position:fixed;right:16px;top:16px;z-index:20;width:48px;height:48px;border-radius:50%;display:none;place-items:center;border:1px solid var(--line);background:rgba(10,20,28,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#mute svg{width:22px;height:22px}
body.started #mute{display:grid}
#brandtag{position:fixed;left:16px;top:18px;z-index:20;display:none;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
#brandtag svg{width:30px;height:30px}
body.started #brandtag{display:flex}

@media (max-width:760px){
  .items{grid-template-columns:1fr;gap:10px;margin-top:26px}
  .item{padding:14px 16px}.item .n{width:42px;height:42px;font-size:17px}
  .two{grid-template-columns:1fr}
  .two{text-align:center}.lead{text-align:left}
  .orb{max-width:240px;order:-1}
  .pillars{gap:10px}.pillar{padding:18px 10px}
}
/* Maria's story */
.sent{margin:8px 0 0;font-size:15px;color:var(--dim)}
#story .wrap{padding-top:clamp(64px,8vh,96px)}
.board{width:100%;aspect-ratio:360/280;border-radius:24px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 0%,#12304a,#0a1726 72%);box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}
.board svg{display:block;width:100%;height:100%;transition:opacity .35s}
.board svg.wipe{opacity:0}
.board .el{transition:opacity 1.4s ease}
.board .faded{opacity:.16}.board .gone{opacity:0}
.board .ln{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;opacity:0;animation:stDraw var(--t,.55s) ease-out var(--d,0s) forwards}
.board .fl{opacity:0;animation:stFade .3s ease var(--d,0s) forwards}
.board .tx{opacity:0;font-family:var(--sans);animation:stWrite var(--t,1s) ease-out var(--d,0s) forwards}
.board .glow{animation:stGlow 1.6s ease-in-out infinite alternate}
@keyframes stDraw{0%{stroke-dashoffset:1;opacity:0}2%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes stFade{to{opacity:1}}
@keyframes stWrite{0%{opacity:0;clip-path:inset(-30% 100% -30% 0)}8%{opacity:1}100%{opacity:1;clip-path:inset(-30% 0 -30% 0)}}
@keyframes stGlow{from{filter:drop-shadow(0 0 0 rgba(255,196,107,0))}to{filter:drop-shadow(0 0 6px rgba(255,196,107,.9))}}
.cap{margin:16px auto 0;max-width:520px;min-height:7em;font-size:clamp(17px,4.6vw,21px);line-height:1.45;font-weight:500;color:var(--ink);text-wrap:pretty}
#stCont{margin-top:10px}#stCont:not(.on){pointer-events:none}
#skip{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:none;background:none;border:0;padding:10px;font-size:14px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
body.storying #skip{display:block}
@media (prefers-reduced-motion:reduce){
  .board .ln,.board .fl,.board .tx{animation-duration:.01s!important}
}
@media (prefers-reduced-motion:reduce){
  .scene,.scene.active,.scene.leaving{transition:opacity .4s!important;transform:none!important;filter:none!important}
  .active .a,.active .split .ch,.qin{animation:none!important;opacity:1!important}
  .reveal{transition:opacity .4s}
}
</style>
</head>
<body>
<div id="sky"></div><div class="sun"></div><div class="horizon"></div>
<canvas id="motes"></canvas>

<div id="brandtag"></div>
<button id="mute" aria-label="Mute audio"></button>

<!-- 0 splash -->
<section class="scene" id="splash" role="button" tabindex="0">
  <div class="wrap">
    <div class="a halo" style="--k:bloom;--t:1.8s"><span class="logo-slot"></span></div>
    <h1 class="mega split" data-k="splashHead" style="--d:.5s;margin-top:28px"></h1>
    <p class="lede a" id="forYou" style="--d:1s;margin-top:14px"></p>
    <p class="sent a" id="sentBy" style="--d:1.15s"></p>
    <div class="a" style="--d:1.4s"><span class="tapline glass pulse"><span class="dot"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span id="tapText"></span></span></div>
    <div class="vol a" style="--d:1.7s"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span id="volText"></span></div>
  </div>
</section>

<!-- 1 logo in / logo out -->
<section class="scene" id="logo">
  <div class="wrap">
    <div class="a halo" style="--k:bloom;--t:2s"><span class="logo-slot big"></span></div>
    <div class="caption a" style="--d:.8s"><em id="capText"></em></div>
  </div>
</section>

<!-- 2 challenges list (income, then savings) -->
<section class="scene" id="list">
  <div class="wrap" style="max-width:980px">
    <div class="a" style="--k:track"><span class="eyebrow" id="listEyebrow"></span></div>
    <h2 class="h1 a" id="listTitle" style="--d:.15s;margin-top:18px"></h2>
    <div class="rule a" style="--d:.3s"></div>
    <div class="items" id="listItems"></div>
  </div>
</section>

<!-- 1b Maria's story: a whiteboard drawing, drawn line by line -->
<section class="scene" id="story">
  <div class="wrap" style="max-width:560px">
    <div class="board"><svg id="boardSvg" viewBox="0 0 360 280" aria-hidden="true"></svg></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="reveal" id="stCont"><button class="btn" id="stGo"><span id="stGoT"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  </div>
</section>
<button id="skip" type="button"></button>

<!-- 3 welcome -->
<section class="scene" id="welcome">
  <div class="wrap">
    <div class="a halo" style="--k:bloom;--t:1.6s"><span class="logo-slot"></span></div>
    <h1 class="mega split" id="welHead" style="--d:.7s;margin-top:26px"></h1>
    <div class="h1 a" style="--d:1.3s;margin-top:10px"><em id="welName"></em></div>
  </div>
</section>

<!-- 4 challenge -->
<section class="scene" id="challenge">
  <div class="wrap">
    <div class="two">
      <div>
        <h2 class="h2 a" id="chHead"></h2>
        <div class="pillars">
          <div class="pillar glass reveal" id="pil1"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></div><h3></h3></div>
          <div class="pillar glass reveal" id="pil2"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7c-1-2-3.5-3-7-3C7 4 4 6.5 4 10c0 2.4 1.3 4.2 3 5.3V19h3v-2h4v2h3v-3.2c1.2-.8 2-1.8 2.5-2.8H21V9.5h-1.6"/><circle cx="15.5" cy="9.5" r=".6" fill="currentColor"/></svg></div><h3></h3></div>

function splitText(el, html){
  el.innerHTML = html;
  let i = 0;
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if(n.nodeType === 3){
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(word => {
          if(!word) return;
          if(/^\s+$/.test(word)){ frag.appendChild(document.createTextNode(' ')); return; }
          const w = document.createElement('span'); w.className = 'w';
          [...word].forEach(c => { const ch = document.createElement('span'); ch.className = 'ch'; ch.style.setProperty('--i', i++); ch.textContent = c; w.appendChild(ch); });
          frag.appendChild(w);
        });
        n.replaceWith(frag);

    });
  };

}

let muted = false, voice = null, sayToken = 0;
function pickVoice(){
  const s = window.speechSynthesis; if(!s) return;
  const vs = s.getVoices().filter(v => v.lang.toLowerCase().startsWith(L.speechLang));
  const pref = L.speechLang === 'es'
    ? ['Paulina','Mónica','Monica','Google español de Estados Unidos','Google español','Microsoft Paloma','Microsoft Elvira']
    : ['Ava (Premium)','Ava (Enhanced)','Samantha (Enhanced)','Google US English','Microsoft Aria','Microsoft Jenny','Ava','Samantha','Allison'];
  for(const p of pref){ const v = vs.find(v => v.name.includes(p)); if(v){ voice = v; return; } }
  voice = vs[0] || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
function unlockSpeech(){
  const s = window.speechSynthesis; if(!s) return;
  try{ s.resume(); const u = new SpeechSynthesisUtterance(' '); u.volume = 0; s.speak(u); }catch(e){}
}
/* recorded voice (Brian, ElevenLabs). Falls back to the browser voice for any line without a recording. */
const vo = new Audio(); vo.preload = 'auto';
const clips = (window.RISE_AUDIO && window.RISE_AUDIO[L.speechLang]) || {};
function playClip(file, my){
  return new Promise(res => {
    let done = false;
    const fin = ok => { if(done) return; done = true; vo.onended = vo.onerror = null; clearTimeout(t); if(my === sayToken) setDuck(false); res(ok && my === sayToken); };
    const t = setTimeout(() => fin(true), 45000);
    vo.onended = () => fin(true); vo.onerror = () => fin(true);
    setDuck(true); vo.src = file; vo.muted = muted; vo.currentTime = 0;
    const p = vo.play(); if(p && p.catch) p.catch(() => setTimeout(() => fin(true), 2500));
    const watch = setInterval(() => { if(my !== sayToken){ clearInterval(watch); fin(false); } if(done) clearInterval(watch); }, 120);
  });
}
function say(text, recordedAs){
  const my = ++sayToken;
  const s = window.speechSynthesis;
  if(s) s.cancel();
  /* recordedAs: the wording the existing recording was made with (see KNOWN MISMATCH at the config) */
  const clip = clips[(text || '').trim()] || (recordedAs && clips[recordedAs.trim()]);
  if(clip) return playClip(clip, my);
  const parts = (text.match(/[^.!?¡¿]*[¡¿]?[^.!?]+[.!?]*/g) || [text]).map(t => t.trim()).filter(Boolean);
  if(!s) return wait(Math.max(1200, text.split(/\s+/).length * 380)).then(() => my === sayToken);
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if(my !== sayToken) return res(false);
      if(i >= parts.length) return res(true);
      const line = parts[i++];
      const u = new SpeechSynthesisUtterance(line);
      if(voice) u.voice = voice;
      u.lang = voice ? voice.lang : L.locale; u.rate = 1; u.pitch = 1; u.volume = muted ? 0 : 1;
      let done = false, timer = null;
      const fin = () => { if(done) return; done = true; clearTimeout(timer); setTimeout(next, 160); };
      u.onend = fin; u.onerror = fin;
      timer = setTimeout(fin, line.split(/\s+/).length * 650 + 2500);
      s.speak(u);
    };
    next();
  });
}
function hush(){ sayToken++; window.speechSynthesis?.cancel(); try{ vo.pause(); }catch(e){} setDuck(false); }

const MUSIC_SRC = 'audio/music/close-to-you.mp3', MUSIC_VOL = .32, MUSIC_DUCK = .13, XFADE = 4;
let ac = null, musicGain = null, musicBuf = null, speaking = false;

function setDuck(on){ speaking = on; if(musicGain && ac) musicGain.gain.setTargetAtTime(musicLevel(), ac.currentTime, .35); }
function loopFrom(when){
  if(!musicBuf || !ac) return;
  const src = ac.createBufferSource(), g = ac.createGain(), T = musicBuf.duration;
  src.buffer = musicBuf; src.connect(g).connect(musicGain);
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + XFADE);
  g.gain.setValueAtTime(1, when + T - XFADE); g.gain.linearRampToValueAtTime(0, when + T);
  src.start(when); src.stop(when + T + .1);
  const next = when + T - XFADE;
  setTimeout(() => loopFrom(next), Math.max(0, (next - ac.currentTime - 3) * 1000));
}

  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = ac.createGain(); musicGain.gain.value = 0; musicGain.connect(ac.destination);

      musicBuf = buf; loopFrom(ac.currentTime + .05);

}

(function motes(){
  const c = $('#motes'), x = c.getContext('2d'); let W, H, dpr, P = [];
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; };
  size(); addEventListener('resize', size);
  for(let i = 0; i < 70; i++) P.push({x:Math.random(), y:Math.random(), r:Math.random()*1.6+.4, v:Math.random()*.00025+.00008, p:Math.random()*6.28, g:Math.random() < .45});
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick = t => {
    x.clearRect(0, 0, W, H);
    const r = parseFloat(getComputedStyle(document.body).getPropertyValue('--r')) || 0;
    for(const m of P){
      if(!still){ m.y -= m.v; if(m.y < -.02){ m.y = 1.02; m.x = Math.random(); } }
      const a = .25 + .45 * Math.abs(Math.sin(t/1400 + m.p));
      x.beginPath(); x.arc(m.x*W + Math.sin(t/3000 + m.p)*12*dpr, m.y*H, m.r*dpr, 0, 6.28);
      x.fillStyle = m.g ? `rgba(255,${190 + r*20|0},${110 + r*20|0},${a})` : `rgba(120,230,225,${a*(1-r*.5)})`;
      x.shadowBlur = 8*dpr; x.shadowColor = x.fillStyle; x.fill();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

/* DRAWING PACE. One line at a time, at a steady hand speed, so the picture builds while Brian talks
   and is complete before he finishes the scene's line.
   SPEED   = chalk speed in drawing units per second (the board is 360 units wide).
   MIN_T   = shortest time for one tiny line (eyes, ticks). TEXT_T = seconds per letter when words write themselves.
   SET_T   = scenery (marked set:true) sketches in all at once over this many seconds.
   HOLD_T  = pause on a beat (the clock hands turning to bars, the paycheck fading).
   DONE    = share of the scene by which the picture must be finished. If a scene has more chalk than fits,
             it speeds up just enough to finish by then. */
const PACE = {SPEED:230, MIN_T:.12, TEXT_T:.1, SET_T:1.1, HOLD_T:.6, DONE:.92};
const SVGNS = 'http://www.w3.org/2000/svg';
let scratch = null;
function inkTime(g){
  if(g.classList.contains('set')) return {t:PACE.SET_T, parts:[...g.querySelectorAll('.ln,.tx,.fl')].map(e => [e, 0])};
  const parts = [...g.querySelectorAll('.ln,.tx,.fl')].map(e => [e,
    e.classList.contains('fl') ? 0 : e.classList.contains('tx') ? Math.max(.35, e.textContent.length * PACE.TEXT_T) : Math.max(PACE.MIN_T, e.getTotalLength() / PACE.SPEED)]);
  return {t:parts.reduce((a, [, t]) => a + t, 0), parts};
}
function planScene(sc){
  if(!scratch){ scratch = document.createElementNS(SVGNS, 'svg'); scratch.setAttribute('viewBox', '0 0 360 280'); scratch.style.cssText = 'position:fixed;left:-9999px;top:0;width:360px;height:280px;visibility:hidden'; document.body.appendChild(scratch); }
  let total = 0;
  for(const [, f] of sc.els){
    if(f === 'clear'){ total += .35; continue; }
    scratch.innerHTML = ''; const out = f(scratch);
    if(typeof out !== 'string'){ total += PACE.HOLD_T; continue; }
    scratch.innerHTML = out; total += [...scratch.children].reduce((a, g) => a + inkTime(g).t, 0);
  }
  scratch.innerHTML = '';
  return Math.max(1, total / (sc.dur * PACE.DONE));   // 1 = steady speed; above 1 = this scene had to hurry
}
function inkIn(nodes, fast){
  let d = 0;
  nodes.forEach(g => {
    const {t, parts} = inkTime(g), set = g.classList.contains('set');
    parts.forEach(([e, dur]) => {
      e.style.setProperty('--d', (set ? d : d) .toFixed(2) + 's');
      e.style.setProperty('--t', ((set ? PACE.SET_T : dur) / fast).toFixed(2) + 's');
      if(!set) d += dur / fast;
    });
    if(set) d += PACE.SET_T / fast;
  });
  return d;
}

function leaveStory(){ hush(); runId++; document.body.classList.remove('storying'); quickCheck(); }

async function story(id, from = 0){
  const svg = $('#boardSvg');
  $('#stCont').classList.remove('on'); svg.innerHTML = ''; $('#cap').textContent = '';
  document.body.classList.add('storying');
  show('story');
  for(let s = from; s < STORY.length; s++){
    const sc = STORY[s];
    if(svg.childNodes.length){ svg.classList.add('wipe'); await wait(240); if(!alive(id)) return; }
    svg.innerHTML = ''; svg.classList.remove('wipe');
    $('#cap').textContent = fillMin(L.story[s]);
    setSky('story', s / STORY.length * .9);
    const fast = planScene(sc);
    const t0 = performance.now(), spoken = say(fillMin(L.story[s]), fillMin(L.story[s], NARRATION_RECORDED_MINUTES));
    let cursor = 0;
    for(const [, f] of sc.els){
      const ms = t0 + cursor * 1000 - performance.now();
      if(ms > 0) await wait(ms); if(!alive(id)) return;
      if(f === 'clear'){ svg.classList.add('wipe'); await wait(330); if(!alive(id)) return; svg.innerHTML = ''; svg.classList.remove('wipe'); cursor += .35; continue; }
      const before = svg.children.length, out = f(svg);
      if(typeof out !== 'string'){ cursor += PACE.HOLD_T / fast; continue; }
      svg.insertAdjacentHTML('beforeend', out);
      cursor += inkIn([...svg.children].slice(before), fast);
    }
    await Promise.all([spoken, wait(Math.max(0, t0 + sc.dur * 1000 - performance.now()))]); if(!alive(id)) return;
    if(!sc.hold) await wait(120);
  }
  $('#stCont').classList.add('on'); document.body.classList.remove('storying');
  track('video_completed');
}

  return `<svg viewBox="0 0 400 400" aria-hidden="true"><defs><linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="var(--acc)" style="stop-color:color-mix(in oklab,#46d9d2,#ffc46b var(--pp))"/><stop offset="1" style="stop-color:color-mix(in oklab,#2a9fd6,#ff8a5b var(--pp))"/></linearGradient><radialGradient id="oc"><stop offset="0" stop-color="#fff3dc" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc46b" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/></radialGradient></defs>
  <circle cx="200" cy="200" r="120" fill="url(#oc)"/>
  ${ring(150, 1, '2 10', 2, .8)}${ring(176, -1, '60 24', 1.5, .5)}${ring(118, -1, '1 6', 3, .7)}
  <g transform="translate(200 200)"><path d="M-70 40 Q -35 -10 0 10 T 70 -40" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" from="200" to="0" dur="2.4s" begin=".6s" fill="freeze"/></path><circle cx="70" cy="-40" r="8" fill="#fff"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.9;1" dur="3s" fill="freeze"/></circle></g></svg>`;
}

/* ---------- QUICK CHECK: 4 real choices, every answer changes the result or the agenda ---------- */
const QUICK = [
  {key:'situation', opts:['job_pay','savings','partner','borrow','nothing']},
  {key:'gap',       opts:['lt1','m1_3','m3_6','gt6','no_idea']},
  {key:'desire',    opts:['protect','extra_income','savings','debt','understand']},
  {key:'time',      opts:['weekday_evening','weekend_morning','lunchtime','daytime']}
];
const PROGRESS = [55, 70, 85, 95];   // the video already counts as progress; result screen = 100
const mk = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };

function quickCheck(){ hush(); renderQ(0); }
function renderQ(k){
  qs.step = 'q' + (k + 1); save();
  if(!current || current.id !== 'check') show('check', k / 4);
  else setSky('check', k / 4);
  const Q = QUICK[k], txt = L.qc.qs[k], picked = qs.a[Q.key];
  $('#qFill').style.width = PROGRESS[k] + '%'; $('#qBar').setAttribute('aria-valuenow', PROGRESS[k]);
  $('#qPill').textContent = L.qc.pill(k + 1);
  const box = mk('div', 'qin');
  if(k === 0) box.appendChild(mk('p', 'qintro', L.qc.intro));
  const h = mk('h2', 'qtext', txt.q); h.id = 'qHead'; h.tabIndex = -1; box.appendChild(h);
  const opts = mk('div', 'opts'); opts.setAttribute('role', 'group'); opts.setAttribute('aria-labelledby', 'qHead');
  let locked = false;
  Q.opts.forEach(v => {
    const b = mk('button', 'opt' + (picked === v ? ' on' : ''), txt.opts[v]);
    b.type = 'button'; b.setAttribute('aria-pressed', String(picked === v));
    b.onclick = () => {
      if(locked) return; locked = true;
      opts.querySelectorAll('.opt').forEach(o => { o.classList.toggle('on', o === b); o.setAttribute('aria-pressed', String(o === b)); });
      qs.a[Q.key] = v; save();
      track(`q${k + 1}_answered`, {answer:v});
      setTimeout(() => k < 3 ? renderQ(k + 1) : showResult(), 250);
    };
    opts.appendChild(b);
  });
  box.appendChild(opts);
  const nav = mk('div', 'qnav');
  if(k > 0){ const bk = mk('button', 'tlink', L.qc.back); bk.type = 'button'; bk.onclick = () => renderQ(k - 1); nav.appendChild(bk); }
  else nav.appendChild(mk('span'));
  const sk = mk('button', 'tlink', L.qc.skip); sk.type = 'button'; sk.onclick = showResult; nav.appendChild(sk);
  box.appendChild(nav);
  $('#qBody').replaceChildren(box);
  $('#check').scrollTop = 0;
  h.focus({preventScroll:true});
}

/* ---------- RESULT + CALENDAR: one screen ---------- */
let calSeen = false, calObs = null;
function showResult(){
  if(qs.step && qs.step[0] === 'q') qs.from = +qs.step.slice(1);
  qs.step = 'result'; save();
  renderResult();
  show('result');
  track('result_shown', {answered:Object.keys(qs.a)});
  calSeen = false;
  if(!calObs && 'IntersectionObserver' in window){
    calObs = new IntersectionObserver(es => es.forEach(e => {
      if(e.isIntersecting && !calSeen && current && current.id === 'result'){ calSeen = true; track('calendar_viewed'); }
    }), {root:$('#result'), threshold:.25});
    calObs.observe($('#bookFrame'));
  }
}
function renderResult(){
  const a = qs.a, R = L.res, lines = [];
  if(R.start[a.situation]) lines.push(R.start[a.situation]);
  let cush = R.cushion[a.gap];
  if(cush && R.start[a.situation] && cush.startsWith(R.joinFrom))
    cush = (['nothing','borrow'].includes(a.situation) && a.gap !== 'lt1' ? R.joinStill : R.joinAnd) + cush.slice(R.joinFrom.length);
  if(cush) lines.push(cush);
  const agenda = a.desire ? R.agenda[a.desire] : '';
  if(agenda) lines.push(R.focus(agenda));
  $('#rHead').textContent = !lines.length ? R.generic : prospectFirst ? R.head(prospectFirst) : R.headNoName;
  $('#rLines').replaceChildren(...lines.map(t => mk('p', '', t)));
  $('#rClose').textContent = agenda ? R.close(MIN, HOST.firstName, agenda) : R.closeNoAgenda(MIN, HOST.firstName);
  $('#rBack').textContent = L.qc.back;
  $('#rFill').style.width = '100%';
  $('#calEyebrow').textContent = HOST.title;
  $('#calHead').textContent = L.cal.head;
  $('#calGuide').textContent = a.time ? L.cal.guide[a.time] : '';
  $('#calGuide').hidden = !a.time;
  $('#calShared').textContent = L.cal.shared;
  $('#calWho').innerHTML = senderIsHost ? L.cal.whoSelf(esc(HOST.firstName)) : L.cal.who(esc(partnerName), esc(HOST.firstName));
  const f = $('#bookFrame'); f.title = HOST.title;
  if(f.getAttribute('src') !== HOST.calendarEmbedUrl) f.src = HOST.calendarEmbedUrl;
  $('#booked').textContent = partnerFirst ? L.cal.booked(partnerFirst) : L.cal.bookedNoName;
  $('#notYet').textContent = L.cal.notYet;
}
$('#rBack').onclick = () => renderQ(Math.min(4, Math.max(1, qs.from || 4)) - 1);
$('#notYet').onclick = () => {   /* scroll the screen itself, never the page body */
  const sc = $('#result');
  sc.scrollTo({top:sc.scrollTop + $('#cal').getBoundingClientRect().top - sc.getBoundingClientRect().top - 76, behavior:'smooth'});
};
$('#booked').onclick = () => {
  track('booked_self_reported', {situation:qs.a.situation || null, gap:qs.a.gap || null, desire:qs.a.desire || null, time:qs.a.time || null});
  showConfirm();
};

/* ---------- CONFIRMATION: honest, and the text to the sender is the real confirmation ---------- */
function smsBody(){
  const s = partnerFirst || L.whereFallback, n = prospectFirst, a = qs.a;
  if(a.gap && a.desire){
    const me = L.sms.me[a.desire];
    return a.gap === 'no_idea' ? L.sms.fullNoIdea(s, n, me) : L.sms.full(s, n, L.sms.gap[a.gap], me);
  }
  return L.sms.short(s, n);
}
function showConfirm(){
  qs.step = 'confirm'; save();
  $('#cfHead').textContent = prospectFirst ? L.cf.head(prospectFirst) : L.cf.headNoName;
  $('#cfBody').textContent = L.cf.body;
  const to = (cfg.pp || '').replace(/[^\d+]/g, ''), t = $('#cfText');
  t.hidden = !to;
  if(to){
    const sep = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? '&' : '?';
    t.href = `sms:${to}${sep}body=${encodeURIComponent(smsBody())}`;
    t.textContent = L.cf.text(partnerFirst || L.whereFallback);
  }
  $('#cfBack').textContent = L.cf.back;
  $('#cfAgain').textContent = L.cf.again;
  show('confirm');
}
$('#cfText').onclick = () => track('text_sender_tapped');
$('#cfBack').onclick = () => { qs.step = 'result'; save(); renderResult(); show('result'); };
$('#cfAgain').onclick = () => { hush(); try{ sessionStorage.removeItem(KEY); }catch(e){} location.reload(); };

/* ---------- coming back to the tab: restore their place ---------- */
function resume(saved){
  Object.assign(qs, {step:saved.step, a:saved.a || {}, from:saved.from || 4});
  begun = true; runId++;
  document.body.classList.add('started');
  addEventListener('pointerdown', () => { unlockSpeech(); startPad(); }, {once:true});
  if(qs.step === 'confirm') showConfirm();
  else if(qs.step === 'result') showResult();
  else renderQ(Math.min(3, Math.max(0, +qs.step.slice(1) - 1 || 0)));
}

/* ---------- start ---------- */
let begun = false;
function begin(){
  if(begun) return; begun = true;
  document.body.classList.add('started');
  unlockSpeech(); startPad();
  try{ vo.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='; vo.play().catch(() => {}); }catch(e){}
  runId++;
  track('journey_started');
  const skip = new URLSearchParams(location.search).get('start');
  if(skip === 'check') quickCheck(); else if(skip === 'result') showResult();
  else if(skip === 'story') story(runId, Math.max(0, Math.min(6, (+new URLSearchParams(location.search).get('s') || 1) - 1)));
  else intro(runId);
}
$('#splash').addEventListener('click', begin);
$('#splash').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') begin(); });
const savedState = loadSaved();
if(savedState) resume(savedState); else show('splash');
